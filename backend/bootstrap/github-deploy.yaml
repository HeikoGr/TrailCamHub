AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  One-time setup so GitHub Actions can deploy the TrailCamHub backend. Deploy
  this stack once by hand (see backend/README.md). It creates an artifact
  bucket, a CloudFormation execution role limited to resources named after the
  backend stack, and an IAM user that may only start deployments of that stack.
  An IAM user with access keys is used instead of GitHub OIDC because AWS
  projects do not allow creating identity providers.

Parameters:
  BackendStackName:
    Type: String
    Default: trailcamhub
    AllowedPattern: '^[a-z][a-z0-9-]*$'
    Description: >-
      Name of the backend stack (lower case). All its resources start with this
      prefix; the execution role is limited to it.

Resources:
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-packages
            Status: Enabled
            ExpirationInDays: 30

  # Assumed by CloudFormation while it creates/updates the backend stack.
  CloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: cloudformation.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: backend-resources
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # With --role-arn, CloudFormation expands the SAM transform
              # as this role, so it needs the transform permission too.
              - Sid: SamTransform
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31'
              - Sid: DynamoDB
                Effect: Allow
                Action: dynamodb:*
                Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${BackendStackName}-*'
              - Sid: S3Buckets
                Effect: Allow
                Action: s3:*
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::${BackendStackName}-*'
                  - !Sub 'arn:${AWS::Partition}:s3:::${BackendStackName}-*/*'
              - Sid: ReadPackages
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${ArtifactBucket.Arn}/*'
              - Sid: Lambda
                Effect: Allow
                Action: lambda:*
                Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${BackendStackName}-*'
              - Sid: FunctionRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:PassRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:GetRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${BackendStackName}-*'
              - Sid: LogGroups
                Effect: Allow
                Action: logs:*
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${BackendStackName}-*'
              - Sid: Describe
                Effect: Allow
                Action:
                  - logs:DescribeLogGroups
                  - lambda:GetFunctionUrlConfig
                Resource: '*'

  # Used by GitHub Actions through an access key (GitHub secrets). It can
  # only hand a change set for the backend stack to CloudFormation, which then
  # works with the execution role above.
  GitHubDeployUser:
    Type: AWS::IAM::User
    Properties:
      Policies:
        - PolicyName: deploy-backend
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: Stack
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStackResources
                  - cloudformation:ListStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${BackendStackName}/*'
              - Sid: SamTransform
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31'
              - Sid: Validate
                Effect: Allow
                Action: cloudformation:ValidateTemplate
                Resource: '*'
              - Sid: Packages
                Effect: Allow
                Action: [s3:PutObject, s3:GetObject, s3:ListBucket]
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub '${ArtifactBucket.Arn}/*'
              - Sid: PassExecutionRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationExecutionRole.Arn

Outputs:
  DeployUserName:
    Description: >-
      Create its access key with: aws iam create-access-key --user-name <name>,
      then store it as GitHub secrets AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
    Value: !Ref GitHubDeployUser
  CloudFormationExecutionRoleArn:
    Description: Repository variable AWS_CFN_EXECUTION_ROLE_ARN
    Value: !GetAtt CloudFormationExecutionRole.Arn
  ArtifactBucketName:
    Description: Repository variable AWS_SAM_ARTIFACT_BUCKET
    Value: !Ref ArtifactBucket
