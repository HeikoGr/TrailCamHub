name: Backend

# Checks the AWS SAM backend in backend/ and deploys it from main via OIDC.
# Deployment is skipped until the repository variables from the one-time
# bootstrap (backend/bootstrap/github-deploy.yaml) are set.

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  push:
    branches:
      - main
      - feature/*
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  check:
    name: Lint, test and build backend
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then
            npm ci
          else
            echo "::warning::backend/package-lock.json is missing; resolving dependencies with npm install"
            ../.github/scripts/run-annotated.sh "npm install" npm install --no-audit --no-fund
          fi

      - name: Check formatting
        run: ../.github/scripts/run-annotated.sh Formatting npm run format:check

      - name: Lint
        run: ../.github/scripts/run-annotated.sh Lint npm run lint

      - name: Type check
        run: ../.github/scripts/run-annotated.sh 'Type check' npm run typecheck

      - name: Unit tests
        run: ../.github/scripts/run-annotated.sh Tests npm test

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Validate templates
        run: |
          ../.github/scripts/run-annotated.sh 'Validate template.yaml' sam validate --lint --region eu-central-1
          ../.github/scripts/run-annotated.sh 'Validate bootstrap' sam validate --lint --region eu-central-1 --template bootstrap/github-deploy.yaml

      - name: Build
        # SAM bundles with esbuild from the PATH (its own npm install skips
        # dev dependencies), so expose the project's copy.
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          ../.github/scripts/run-annotated.sh 'SAM build' sam build

  deploy:
    name: Deploy backend to AWS
    needs: check
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: backend-deploy
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build and deploy
        shell: bash
        env:
          ARTIFACT_BUCKET: ${{ vars.AWS_SAM_ARTIFACT_BUCKET }}
          EXECUTION_ROLE: ${{ vars.AWS_CFN_EXECUTION_ROLE_ARN }}
          ALLOWED_ORIGIN: https://${{ github.repository_owner }}.github.io
        run: |
          set -euo pipefail
          export PATH="$PWD/node_modules/.bin:$PATH"
          sam build
          sam deploy \
            --region "$AWS_REGION" \
            --s3-bucket "$ARTIFACT_BUCKET" \
            --role-arn "$EXECUTION_ROLE" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides "AllowedOrigin=${ALLOWED_ORIGIN,,}"
          api_url="$(aws cloudformation describe-stacks --stack-name trailcamhub \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" --output text)"
          echo "### Backend deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "API URL: \`$api_url\`" >> "$GITHUB_STEP_SUMMARY"
